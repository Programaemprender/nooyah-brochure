<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>NOOYAH · Maletas de Bicicleta — Brochure Comercial</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      /* scroll natural en la página principal */
      overflow-x: hidden;
    }

    /* El iframe ocupa el 100% del viewport y crece con el contenido */
    #brochure-wrap {
      width: 100%;
      /* Altura inicial = viewport; JS la ajusta al contenido real */
      height: 100vh;
      overflow: hidden;
    }
    #brochure-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Sección videos */
    #videos {
      background: #0a0a0a;
      padding: 64px 24px 80px;
      border-top: 1px solid #1a1a1a;
    }
    #videos h2 {
      color: #fff;
      font-size: clamp(18px, 5vw, 28px);
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 8px;
    }
    #videos .sub {
      color: #555;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 40px;
    }
    .vgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 960px;
      margin: 0 auto;
    }
    @media (max-width: 600px) {
      .vgrid { grid-template-columns: 1fr; }
    }
    .vitem video {
      width: 100%;
      border-radius: 6px;
      background: #111;
      display: block;
    }
    .vitem p {
      color: #444;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 10px;
    }
    .vfooter {
      color: #2a2a2a;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 48px;
      border-top: 1px solid #141414;
      padding-top: 24px;
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <div id="brochure-wrap">
    <iframe
      id="brochure-frame"
      src="brochure.html"
      scrolling="yes"
      title="NOOYAH Brochure Comercial"
    ></iframe>
  </div>

  <section id="videos">
    <h2>Videos de Demostración</h2>
    <p class="sub">NOOYAH en acción &middot; Maletas para ciclismo de alto rendimiento</p>
    <div class="vgrid">
      <div class="vitem">
        <video controls playsinline preload="metadata">
          <source src="demo1.mp4" type="video/mp4">
        </video>
        <p>Demo 1 &middot; Instalación y uso</p>
      </div>
      <div class="vitem">
        <video controls playsinline preload="metadata">
          <source src="demo2.mp4" type="video/mp4">
        </video>
        <p>Demo 2 &middot; Características y capacidad</p>
      </div>
    </div>
    <p class="vfooter">NOOYAH &middot; Brochure Comercial Chile 2026</p>
  </section>

  <script>
    // Ajustar altura del iframe al contenido real del brochure
    // Esto evita el doble scroll y el zoom raro en móvil
    var frame = document.getElementById('brochure-frame');
    var wrap  = document.getElementById('brochure-wrap');

    function resizeFrame() {
      try {
        var h = frame.contentDocument.documentElement.scrollHeight;
        if (h && h > 200) {
          wrap.style.height = h + 'px';
          frame.style.height = h + 'px';
        }
      } catch(e) {}
    }

    frame.addEventListener('load', function() {
      // Esperar un tick para que el bundler termine de renderizar
      setTimeout(resizeFrame, 800);
      setTimeout(resizeFrame, 2000); // segundo intento por si el bundle tarda
    });

    // Resize del viewport
    window.addEventListener('resize', resizeFrame);
  </script>

</body>
</html>
