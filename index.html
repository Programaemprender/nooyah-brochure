<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOOYAH · Maletas de Bicicleta — Brochure Comercial</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Iframe ocupa 100% del ancho y crece con el contenido */
    #brochure-outer {
      width: 100%;
    }
    #brochure-frame {
      width: 100%;
      border: none;
      display: block;
      /* altura se calcula en JS */
      height: 100vh;
    }

    /* Videos — 100% del ancho disponible */
    #videos {
      width: 100%;
      background: #0a0a0a;
      padding: 56px 24px 72px;
      border-top: 1px solid #1a1a1a;
    }
    #videos h2 {
      color: #fff;
      font-size: clamp(16px, 4vw, 26px);
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 8px;
    }
    .sub {
      color: #555;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 36px;
    }
    .vgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    @media (max-width: 580px) {
      .vgrid { grid-template-columns: 1fr; }
      #videos { padding: 40px 16px 56px; }
    }
    .vitem video {
      width: 100%;
      border-radius: 6px;
      background: #111;
      display: block;
    }
    .vitem p {
      color: #444;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 8px;
    }
    .vfooter {
      color: #2a2a2a;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #141414;
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <div id="brochure-outer">
    <iframe
      id="brochure-frame"
      src="brochure.html"
      scrolling="no"
      title="NOOYAH Brochure Comercial"
    ></iframe>
  </div>

  <section id="videos">
    <h2>Videos de Demostración</h2>
    <p class="sub">NOOYAH en acción &middot; Maletas para ciclismo de alto rendimiento</p>
    <div class="vgrid">
      <div class="vitem">
        <video controls playsinline preload="metadata">
          <source src="demo1.mp4" type="video/mp4">
        </video>
        <p>Demo 1 &middot; Instalación y uso</p>
      </div>
      <div class="vitem">
        <video controls playsinline preload="metadata">
          <source src="demo2.mp4" type="video/mp4">
        </video>
        <p>Demo 2 &middot; Características y capacidad</p>
      </div>
    </div>
    <p class="vfooter">NOOYAH &middot; Brochure Comercial Chile 2026</p>
  </section>

  <script>
    var frame = document.getElementById('brochure-frame');
    var outer = document.getElementById('brochure-outer');

    function resizeFrame() {
      try {
        var doc = frame.contentDocument || frame.contentWindow.document;
        var h = doc.documentElement.scrollHeight || doc.body.scrollHeight;
        if (h > 200) {
          frame.style.height = h + 'px';
          outer.style.height = h + 'px';
        }
      } catch(e) {}
    }

    frame.addEventListener('load', function() {
      setTimeout(resizeFrame, 700);
      setTimeout(resizeFrame, 2000);
      setTimeout(resizeFrame, 4000);
    });
    window.addEventListener('resize', resizeFrame);
  </script>

</body>
</html>
