<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOOYAH · Maletas de Bicicleta — Brochure Comercial</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
    }
    #brochure-outer {
      width: 100%;
      overflow: hidden;
    }
    #brochure-frame {
      width: 1200px;
      height: 100vh;
      border: none;
      display: block;
      transform-origin: top left;
    }
    #videos {
      background: #0a0a0a;
      padding: 56px 24px 72px;
      border-top: 1px solid #1a1a1a;
    }
    #videos h2 {
      color: #fff;
      font-size: clamp(18px, 5vw, 26px);
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 8px;
    }
    .sub {
      color: #555;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 36px;
    }
    .vgrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 960px;
      margin: 0 auto;
    }
    @media (max-width: 600px) {
      .vgrid { grid-template-columns: 1fr; }
      #videos { padding: 40px 16px 56px; }
    }
    .vitem video {
      width: 100%;
      border-radius: 6px;
      background: #111;
      display: block;
    }
    .vitem .model {
      color: #e11a1a;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 10px;
    }
    .vitem .desc {
      color: #444;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 4px;
    }
    .vfooter {
      color: #2a2a2a;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid #141414;
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <div id="brochure-outer">
    <iframe
      id="brochure-frame"
      src="brochure.html"
      scrolling="no"
      title="NOOYAH Brochure Comercial"
    ></iframe>
  </div>

  <section id="videos">
    <h2>Videos de Demostración</h2>
    <p class="sub">NOOYAH en acción &middot; Maletas para ciclismo de alto rendimiento</p>
    <div class="vgrid">
      <div class="vitem">
        <video controls playsinline preload="metadata">
          <source src="demo1.mp4" type="video/mp4">
        </video>
        <p class="model">BK004S</p>
        <p class="desc">Demo · Instalación y uso</p>
      </div>
      <div class="vitem">
        <video controls playsinline preload="metadata">
          <source src="demo2.mp4" type="video/mp4">
        </video>
        <p class="model">BK002</p>
        <p class="desc">Demo · Instalación y uso</p>
      </div>
    </div>
    <p class="vfooter">NOOYAH &middot; Brochure Comercial Chile 2026</p>
  </section>

  <script>
    var BROCHURE_WIDTH = 1200;
    var frame = document.getElementById('brochure-frame');
    var outer = document.getElementById('brochure-outer');

    function scaleFrame() {
      var vw = window.innerWidth;
      var scale = vw / BROCHURE_WIDTH;
      frame.style.transform = 'scale(' + scale + ')';
      frame.style.transformOrigin = 'top left';
      var frameH = 0;
      try {
        var innerH = frame.contentDocument.documentElement.scrollHeight;
        frameH = innerH > 200 ? innerH : window.innerHeight;
      } catch(e) {
        frameH = window.innerHeight;
      }
      frame.style.height = frameH + 'px';
      outer.style.height = (frameH * scale) + 'px';
    }

    frame.addEventListener('load', function() {
      setTimeout(scaleFrame, 600);
      setTimeout(scaleFrame, 1800);
    });
    window.addEventListener('resize', scaleFrame);
    scaleFrame();
  </script>

</body>
</html>
