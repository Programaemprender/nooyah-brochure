<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NOOYAH · Maletas de Bicicleta — Brochure Comercial</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; }

    /* Brochure iframe — altura del viewport */
    #brochure-frame {
      display: block;
      width: 100%;
      height: 100vh;
      border: none;
    }

    /* Sección de videos */
    #videos {
      background: #0a0a0a;
      padding: 64px 32px 80px;
    }
    #videos h2 {
      color: #fff;
      font-size: clamp(20px, 4vw, 32px);
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 10px;
    }
    #videos .subtitle {
      color: #666;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-align: center;
      margin-bottom: 48px;
    }
    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      max-width: 1000px;
      margin: 0 auto;
    }
    @media (max-width: 640px) {
      .video-grid { grid-template-columns: 1fr; }
      #videos { padding: 48px 20px 64px; }
    }
    .video-item video {
      width: 100%;
      border-radius: 6px;
      background: #111;
      display: block;
    }
    .video-item p {
      color: #555;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      margin-top: 10px;
    }
    .divider {
      border: none;
      border-top: 1px solid #1a1a1a;
      margin: 48px auto 0;
      max-width: 1000px;
    }
    .footer-note {
      color: #333;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      padding-top: 28px;
    }
  </style>
</head>
<body>

  <!-- Brochure completo -->
  <iframe id="brochure-frame" src="brochure.html" title="NOOYAH Brochure Comercial"></iframe>

  <!-- Videos de demostración -->
  <section id="videos">
    <h2>Videos de Demostración</h2>
    <p class="subtitle">NOOYAH en acción &middot; Maletas para ciclismo de alto rendimiento</p>

    <div class="video-grid">
      <div class="video-item">
        <video controls playsinline preload="metadata">
          <source src="demo1.mp4" type="video/mp4">
        </video>
        <p>Demo 1 &middot; Instalación y uso</p>
      </div>
      <div class="video-item">
        <video controls playsinline preload="metadata">
          <source src="demo2.mp4" type="video/mp4">
        </video>
        <p>Demo 2 &middot; Características y capacidad</p>
      </div>
    </div>

    <hr class="divider">
    <p class="footer-note">NOOYAH &middot; Brochure Comercial Chile 2026</p>
  </section>

</body>
</html>
